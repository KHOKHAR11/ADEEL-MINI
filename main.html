<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEEL-MINI – Red Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--gold:#ffd700;
--card:rgba(102,0,0,.85);
--border:rgba(255,215,0,.35);
--text:#fff;
--text-soft:#ffcccc;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Outfit',sans-serif;
background:radial-gradient(circle at top,#9b0000,#3b0000);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

.grid-bg{
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,0,0,.1) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,0,0,.1) 1px,transparent 1px);
background-size:50px 50px;
z-index:0;
pointer-events:none;
}

header{
position:sticky;
top:0;
z-index:100;
background:rgba(128,0,0,.92);
border-bottom:2px solid var(--gold);
}

.navbar{
max-width:1200px;
margin:auto;
padding:18px 24px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.8rem;
font-weight:900;
display:flex;
gap:10px;
align-items:center;
}

.logo i{color:var(--gold)}

.online{
background:rgba(0,0,0,.35);
padding:6px 16px;
border-radius:20px;
font-size:.9rem;
}

main{
max-width:1200px;
margin:auto;
padding:40px 20px;
position:relative;
z-index:1;
}

.hero{text-align:center;margin-bottom:40px}
.hero p{color:var(--text-soft)}

.section{
background:var(--card);
border:2px solid var(--border);
border-radius:22px;
padding:40px;
}

.input-field{
width:100%;
padding:14px;
margin:15px 0;
border-radius:12px;
border:1.5px solid #fff;
background:rgba(255,255,255,.12);
color:#fff;
}

.btn{
padding:14px 30px;
border-radius:12px;
border:none;
font-weight:700;
cursor:pointer;
display:inline-flex;
align-items:center;
gap:10px;
transition:.3s;
}

.btn-primary{
background:#fff;
color:#800000;
}

.btn-primary:hover{
transform:scale(1.05);
box-shadow:0 0 18px rgba(255,215,0,.6);
}

.btn-secondary{
background:transparent;
border:1.5px solid #fff;
color:#fff;
margin-top:12px;
}

.code-display{
display:none;
margin-top:25px;
background:rgba(0,0,0,.4);
border:2px dashed var(--gold);
border-radius:18px;
padding:30px;
text-align:center;
}

.code-display.show{display:block}

.code-value{
font-size:1.8rem;
font-weight:900;
letter-spacing:5px;
color:var(--gold);
}

.particle{
position:absolute;
width:4px;
height:15px;
background:var(--gold);
border-radius:2px;
pointer-events:none;
z-index:999;
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<header>
<div class="navbar">
<div class="logo"><i class="fab fa-whatsapp"></i> ADEEL-MINI</div>
<div class="online"><span style="color:var(--gold)">●</span> Online</div>
</div>
</header>

<main>

<div class="hero">
<h1>Bot Management</h1>
<p>Powerful WhatsApp Automation</p>
</div>

<div class="section">
<h2>Connect Bot</h2>

<input id="phone-number" class="input-field" placeholder="923XXXXXXXXX">

<button class="btn btn-primary" id="pair-btn">
<i class="fas fa-key"></i> Generate Pairing Code
</button>

<div id="code-display" class="code-display">
<div>Your Code</div>
<div class="code-value" id="pair-code">------</div>

<button class="btn btn-secondary" id="copy-btn">
<i class="fas fa-copy"></i> Copy Code
</button>
</div>
</div>

</main>

<script>
const phoneNumber=document.getElementById("phone-number");
const pairBtn=document.getElementById("pair-btn");
const pairCode=document.getElementById("pair-code");
const codeDisplay=document.getElementById("code-display");
const copyBtn=document.getElementById("copy-btn");

function createParticles(x,y){
for(let i=0;i<20;i++){
const p=document.createElement("div");
p.className="particle";
document.body.appendChild(p);
const a=Math.random()*Math.PI*2;
p.style.left=x+"px";
p.style.top=y+"px";
p.animate(
[{transform:"translate(0,0)",opacity:1},
{transform:`translate(${Math.cos(a)*120}px,${Math.sin(a)*120}px)`,opacity:0}],
{duration:700}
).onfinish=()=>p.remove();
}
}

pairBtn.onclick=async e=>{
createParticles(e.pageX,e.pageY);
const phone=phoneNumber.value.trim();
if(!phone) return alert("Number daalo");

const r=await fetch(`/code?number=${phone}`);
const d=await r.json();
if(d.code){
pairCode.textContent=d.code;
codeDisplay.classList.add("show");
}
};

copyBtn.onclick=e=>{
createParticles(e.pageX,e.pageY);
navigator.clipboard.writeText(pairCode.textContent);
};
</script>

</body>
</html>
