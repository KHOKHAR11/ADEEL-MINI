<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEEL-MINI - Red Gold Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #800000; /* Deep Red */
            --bg-secondary: #a00000;
            --bg-card: #660000;
            --accent-gold: #ffd700; /* Gold */
            --text-primary: #ffffff;
            --text-secondary: #ffcccc;
            --border-color: rgba(255, 255, 255, 0.2);
            --success: #10b981;
            --error: #ffea00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Red Grid Background */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        .container { position: relative; z-index: 2; width: 100%; max-width: 480px; }

        .card {
            background: rgba(139, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid var(--accent-gold);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .logo-box {
            width: 80px; height: 80px;
            background: #fff;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem; color: var(--bg-primary);
            box-shadow: 0 0 20px var(--accent-gold);
        }

        h1 { font-weight: 900; color: #fff; margin-bottom: 10px; }

        .input-field {
            width: 100%; padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #fff;
            border-radius: 12px;
            color: #fff; font-size: 1.05rem;
            margin-top: 10px;
        }

        /* White Buttons */
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer;
            transition: all 0.3s;
            position: relative;
            margin-top: 15px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-primary {
            background: #ffffff;
            color: #800000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover { transform: scale(1.02); background: #f0f0f0; }

        .btn-secondary { background: transparent; border: 1px solid #fff; color: #fff; }

        /* Gold Particles Styling */
        .particle {
            position: absolute;
            width: 4px; height: 15px; /* Tanay jaisa look */
            background: var(--accent-gold);
            pointer-events: none;
            border-radius: 2px;
            z-index: 10;
        }

        .code-display {
            background: rgba(0,0,0,0.3);
            border: 2px dashed var(--accent-gold);
            padding: 20px; margin-top: 20px; border-radius: 15px;
            display: none;
        }
        .code-display.show { display: block; }

        .code-value {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 5px;
            color: var(--accent-gold); margin: 10px 0;
        }

        .back-link { color: #fff; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="card">
            <div class="logo-box"><i class="fab fa-whatsapp"></i></div>
            <h1>ADEEL-MINI</h1>
            <p style="color: #ffcccc; margin-bottom: 20px;">Connect your WhatsApp bot in seconds</p>

            <form id="pairForm" onsubmit="handleSubmit(event)">
                <div style="text-align: left;">
                    <label style="font-weight: 600;"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="text" class="input-field" id="phoneNumber" placeholder="923035512967" required>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-link"></i> Generate Pairing Code
                </button>
            </form>

            <div class="code-display" id="codeDisplay">
                <div style="font-size: 0.8rem; text-transform: uppercase;">Pairing Code</div>
                <div class="code-value" id="pairingCode">--------</div>
                <button type="button" class="btn btn-secondary" onclick="copyCode()">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
            </div>

            <div id="statusAlert" style="margin-top: 15px; font-weight: bold;"></div>

            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Particle Effect (Golden Tanay)
        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const tx = Math.cos(angle) * 150;
                const ty = Math.sin(angle) * 150;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.transform = `rotate(${angle}rad)`;

                const animation = p.animate([
                    { transform: `translate(0,0) rotate(${angle}rad)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${angle}rad)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });

                animation.onfinish = () => p.remove();
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            // Effect Trigger
            const rect = e.target.querySelector('button').getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2);

            const phone = document.getElementById('phoneNumber').value;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusAlert');

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch(`/code?number=${phone}`);
                const data = await response.json();

                if (data.code) {
                    document.getElementById('pairingCode').innerText = data.code;
                    document.getElementById('codeDisplay').classList.add('show');
                    status.style.color = "#ffd700";
                    status.innerText = "Code Generated Successfully!";
                } else {
                    status.style.color = "#ffea00";
                    status.innerText = data.error || "Error occurred";
                }
            } catch (err) {
                status.innerText = "Connection Error";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Pairing Code";
            }
        }

        function copyCode() {
            const code = document.getElementById('pairingCode').innerText;
            navigator.clipboard.writeText(code);
            alert("Code Copied!");
        }
    </script>
</body>
</html>
