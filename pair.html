<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEEL-MINI - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--bg:#800000;
--card:rgba(102,0,0,.85);
--gold:#ffd700;
--text:#fff;
--border:rgba(255,215,0,.35);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Outfit',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

/* Grid */
.grid-bg{
position:fixed;inset:0;
background:
linear-gradient(rgba(255,0,0,.1) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,0,0,.1) 1px,transparent 1px);
background-size:50px 50px;
z-index:0;
}

/* Header */
header{
position:sticky;top:0;z-index:100;
background:rgba(128,0,0,.9);
backdrop-filter:blur(10px);
border-bottom:2px solid var(--gold);
}

.navbar{
max-width:1200px;
margin:auto;
padding:20px 24px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.8rem;
font-weight:900;
display:flex;
gap:10px;
align-items:center;
}
.logo i{color:var(--gold)}

.online{
background:rgba(0,0,0,.3);
padding:6px 16px;
border-radius:20px;
}

/* Main */
main{
max-width:1200px;
margin:auto;
padding:40px 20px;
position:relative;
z-index:1;
}

.section{
background:var(--card);
border:2px solid var(--border);
border-radius:22px;
padding:40px;
max-width:1000px;
margin:auto;
text-align:center;
}

.input{
width:100%;
padding:14px;
border-radius:12px;
border:1.5px solid #fff;
background:rgba(255,255,255,.1);
color:#fff;
margin-bottom:20px;
}

/* Buttons */
.btn-generate{
padding:14px 30px;
border-radius:12px;
border:none;
background:#fff;
color:#800000;
font-weight:700;
cursor:pointer;
display:inline-flex;
align-items:center;
gap:10px;
transition:.3s;
}

.btn-copy{
margin-top:15px;
padding:10px 25px;
border-radius:10px;
border:1.5px solid #fff;
background:transparent;
color:#fff;
font-weight:600;
cursor:pointer;
transition:.3s;
}

/* Code Box */
.code-display{
display:none;
margin-top:25px;
background:rgba(0,0,0,.4);
border:2px dashed var(--gold);
border-radius:18px;
padding:30px;
}

.code-display.show{display:block}

.code-value{
font-size:2.2rem;
font-weight:900;
letter-spacing:8px;
color:var(--gold);
margin:10px 0;
}

/* Particles */
.particle{
position:absolute;
width:4px;
height:12px;
background:var(--gold);
border-radius:2px;
pointer-events:none;
z-index:999;
}
</style>
</head>

<body>
<div class="grid-bg"></div>

<header>
<div class="navbar">
<div class="logo"><i class="fab fa-whatsapp"></i> ADEEL-MINI</div>
<div class="online"><span style="color:var(--gold)">●</span> Online</div>
</div>
</header>

<main>
<div class="section">
<h2 style="margin-bottom:20px">
<i class="fas fa-link" style="color:var(--gold)"></i> Connect Bot
</h2>

<input id="phone" class="input" placeholder="923035512967">

<button class="btn-generate" id="pairBtn">
<i class="fas fa-key"></i> Generate Pairing Code
</button>

<div class="code-display" id="codeBox">
<div style="font-size:.8rem;opacity:.7">Your Code</div>
<div class="code-value" id="pairCode">------</div>

<button class="btn-copy" id="copyBtn">Copy Code</button>
</div>
</div>
</main>

<script>
function particles(x,y){
for(let i=0;i<30;i++){
const p=document.createElement("div");
p.className="particle";
document.body.appendChild(p);
const a=Math.random()*Math.PI*2;
const tx=Math.cos(a)*160;
const ty=Math.sin(a)*160;
p.style.left=x+"px";
p.style.top=y+"px";
p.animate(
[{transform:"translate(0,0)",opacity:1},
{transform:`translate(${tx}px,${ty}px)`,opacity:0}],
{duration:900,easing:"ease-out"}
).onfinish=()=>p.remove();
}
}

pairBtn.onclick=async e=>{
particles(e.pageX,e.pageY);
const phone=phone.value.trim();
if(!phone) return;

pairBtn.disabled=true;
pairBtn.innerHTML="Generating...";

try{
const r=await fetch(`/code?number=${phone}`);
const d=await r.json();
if(d.code){
pairCode.textContent=d.code;
codeBox.classList.add("show");
}
}catch{}

pairBtn.disabled=false;
pairBtn.innerHTML='<i class="fas fa-key"></i> Generate Pairing Code';
};

copyBtn.onclick=e=>{
particles(e.pageX,e.pageY);
navigator.clipboard.writeText(pairCode.textContent);
copyBtn.textContent="Copied!";
copyBtn.style.color=copyBtn.style.borderColor= "var(--gold)";
setTimeout(()=>{
copyBtn.textContent="Copy Code";
copyBtn.style.color=copyBtn.style.borderColor="#fff";
},2000);
};
</script>

</body>
</html>
