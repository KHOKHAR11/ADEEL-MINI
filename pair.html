<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEEL-MINI - Red Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #800000; 
            --bg-card: rgba(102, 0, 0, 0.9);
            --accent-gold: #ffd700; 
            --text-primary: #ffffff;
            --border-color: rgba(255, 215, 0, 0.3);
            --gradient-gold: linear-gradient(135deg, #ffd700 0%, #ffae00 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .container { max-width: 600px; margin: 40px auto; padding: 20px; }

        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 900; color: #fff; margin-bottom: 10px; display: block; }
        
        .status-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px;
        }

        .section {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 20px; padding: 30px; text-align: center;
        }

        .input-field {
            width: 100%; padding: 14px; background: rgba(255,255,255,0.1);
            border: 1.5px solid #fff; border-radius: 12px; color: #fff; margin: 15px 0; font-size: 1rem;
        }

        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
            font-family: 'Outfit', sans-serif;
        }
        
        .btn-primary { background: #fff; color: #800000; margin-bottom: 20px; }

        .code-display {
            background: rgba(13, 17, 33, 0.4);
            border: 1.5px dashed var(--accent-gold);
            border-radius: 16px; padding: 25px; margin-top: 20px;
            display: none;
        }
        .code-display.show { display: block; }

        .code-value {
            font-size: 1.8rem; font-weight: 900; letter-spacing: 5px;
            color: var(--accent-gold); margin-bottom: 15px; display: block;
        }

        /* Zaynix Style Copy Button - Adapted for Red/Gold */
        .btn-secondary {
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--text-primary);
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .particle {
            position: absolute; width: 3px; height: 12px;
            background: linear-gradient(to bottom, var(--accent-gold), #fff);
            pointer-events: none; border-radius: 2px; z-index: 9999;
            box-shadow: 0 0 5px var(--accent-gold);
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="header">
            <span class="logo">ADEEL-MINI</span>
            <div class="status-box">
                <p style="opacity: 0.7;">System Status</p>
                <h2 style="color:var(--accent-gold)">STABLE</h2>
            </div>
        </div>

        <div class="section">
            <h3 style="margin-bottom:15px;"><i class="fas fa-link" style="color:var(--accent-gold)"></i> Connect Bot</h3>
            <input type="text" id="phone-number" class="input-field" placeholder="923035512967">
            
            <button class="btn btn-primary" id="pair-btn" onclick="generatePairCode(event)">
                <i class="fas fa-key"></i> Generate Pairing Code
            </button>

            <div id="code-display" class="code-display">
                <span style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 10px;">YOUR PAIRING CODE</span>
                <span class="code-value" id="pair-code">--------</span>
                
                <button type="button" class="btn btn-secondary" id="copy-btn" onclick="copyCode(event)">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
            </div>
        </div>
    </div>

    <script>
        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 4 + Math.random() * 10;
                const tx = Math.cos(angle) * 150;
                const ty = Math.sin(angle) * 150;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.transform = `rotate(${angle}rad)`;

                const anim = p.animate([
                    { transform: `translate(0,0) rotate(${angle}rad)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${angle}rad)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' });

                anim.onfinish = () => p.remove();
            }
        }

        async function generatePairCode(e) {
            createParticles(e.pageX, e.pageY);
            const phone = document.getElementById('phone-number').value.trim();
            if(!phone) return;

            const btn = document.getElementById('pair-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

            try {
                const res = await fetch(`/code?number=${phone}`);
                const data = await res.json();
                if(data.code) {
                    document.getElementById('pair-code').textContent = data.code;
                    document.getElementById('code-display').classList.add('show');
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Generate Pairing Code';
            }
        }

        function copyCode(e) {
            createParticles(e.pageX, e.pageY);
            const code = document.getElementById('pair-code').textContent;
            const btn = document.getElementById('copy-btn');

            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.borderColor = "var(--accent-gold)";
                btn.style.color = "var(--accent-gold)";
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.borderColor = "var(--border-color)";
                    btn.style.color = "var(--text-primary)";
                }, 2000);
            });
        }
    </script>
</body>
</html>
