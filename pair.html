<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEEL-MINI - Red Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #800000; 
            --bg-card: rgba(102, 0, 0, 0.9);
            --accent-gold: #ffd700; 
            --text-primary: #ffffff;
            --border-color: rgba(255, 215, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Red Grid Background */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .container { max-width: 600px; margin: 40px auto; padding: 20px; }

        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5rem; font-weight: 900; color: #fff; margin-bottom: 10px; display: block; }
        
        .status-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px;
        }

        .section {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 20px; padding: 30px; text-align: center;
        }

        .input-field {
            width: 100%; padding: 14px; background: rgba(255,255,255,0.1);
            border: 1.5px solid #fff; border-radius: 12px; color: #fff; margin: 15px 0; font-size: 1rem;
        }

        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        
        .btn-primary { background: #fff; color: #800000; margin-bottom: 20px; }

        .code-display {
            border: 2px dashed var(--accent-gold);
            border-radius: 16px; padding: 20px; margin-top: 20px;
        }

        .code-value {
            font-size: 2.5rem; font-weight: 900; letter-spacing: 5px;
            color: var(--accent-gold); margin-bottom: 15px; display: block;
        }

        /* Copy Button New Style */
        .btn-copy {
            background: transparent; border: 2px solid #fff; color: #fff;
            width: auto; padding: 10px 30px; margin: 0 auto;
        }

        /* Golden Particles Styling */
        .particle {
            position: absolute; width: 3px; height: 12px;
            background: linear-gradient(to bottom, var(--accent-gold), #fff);
            pointer-events: none; border-radius: 2px; z-index: 9999;
            box-shadow: 0 0 5px var(--accent-gold);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <div class="header">
            <span class="logo">ADEEL-MINI</span>
            <div class="status-box">
                <p style="color:var(--text-secondary)">System</p>
                <h2 style="color:var(--accent-gold)">STABLE</h2>
            </div>
        </div>

        <div class="section">
            <h3 style="margin-bottom:15px;"><i class="fas fa-link" style="color:var(--accent-gold)"></i> Connect Bot</h3>
            <input type="text" id="phone-number" class="input-field" placeholder="923035512967">
            
            <button class="btn btn-primary" onclick="generateCode(event)">
                <i class="fas fa-key"></i> Generate Pairing Code
            </button>

            <div class="code-display">
                <span style="font-size: 0.8rem; opacity: 0.8;">YOUR CODE</span>
                <span class="code-value" id="pair-code">ADEEL1MD</span>
                
                <button class="btn btn-copy" id="copy-btn" onclick="copyCode(event)">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tanay (Particles) Effect
        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 4 + Math.random() * 10;
                const tx = Math.cos(angle) * 150;
                const ty = Math.sin(angle) * 150;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.transform = `rotate(${angle}rad)`;

                const anim = p.animate([
                    { transform: `translate(0,0) rotate(${angle}rad)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${angle}rad)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' });

                anim.onfinish = () => p.remove();
            }
        }

        function generateCode(e) {
            createParticles(e.pageX, e.pageY);
            // Logic for generation goes here
        }

        // Fixed Copy Function (No White Alert Page)
        function copyCode(e) {
            createParticles(e.pageX, e.pageY);
            const code = document.getElementById('pair-code').textContent;
            const btn = document.getElementById('copy-btn');

            navigator.clipboard.writeText(code).then(() => {
                // Style Change instead of Alert
                const originalContent = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.backgroundColor = "rgba(255, 215, 0, 0.2)";
                btn.style.borderColor = "var(--accent-gold)";
                btn.style.color = "var(--accent-gold)";
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.style.backgroundColor = "transparent";
                    btn.style.borderColor = "#fff";
                    btn.style.color = "#fff";
                }, 2000);
            });
        }
    </script>

                <div style="text-transform:uppercase; font-size:0.8rem; margin-bottom:10px;">Your Code</div>
                <div class="code-value" id="pair-code">--------</div>
                <button class="btn btn-secondary" id="copy-btn" onclick="copyCode(event)">

    <script>
        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 4 + Math.random() * 10;
                const tx = Math.cos(angle) * 150;
                const ty = Math.sin(angle) * 150;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.transform = `rotate(${angle}rad)`;

                const anim = p.animate([
                    { transform: `translate(0,0) rotate(${angle}rad)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${angle}rad)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' });

                anim.onfinish = () => p.remove();
            }
        }

        async function generatePairCode(e) {
            createParticles(e.pageX, e.pageY);
            const phone = document.getElementById('phone-number').value.trim();
            if(!phone) return;

            const btn = document.getElementById('pair-btn');
            btn.disabled = true;
            btn.innerHTML = "Generating...";

            try {
                const res = await fetch(`/code?number=${phone}`);
                const data = await res.json();
                if(data.code) {
                    document.getElementById('pair-code').textContent = data.code;
                    document.getElementById('code-display').classList.add('show');
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Generate Pairing Code';
            }
        }

        // Fixed Copy Code Function
        function copyCode(e) {
            createParticles(e.pageX, e.pageY);
            const code = document.getElementById('pair-code').textContent;
            const btn = document.getElementById('copy-btn');

            navigator.clipboard.writeText(code).then(() => {
                // Button Feedback instead of Alert
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check" style="color:var(--accent-gold)"></i> Copied!';
                btn.style.borderColor = "var(--accent-gold)";
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.borderColor = "#fff";
                }, 2000);
            });
        }
    </script>
</body>
</html>
