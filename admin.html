<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Admin Panel - ADEEL-MINI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon-dark: #3b0000;
            --maroon-light: #800000;
            --gold: #ffd700;
            --card-bg: rgba(102, 0, 0, 0.85);
            --border: rgba(255, 215, 0, 0.3);
            --text-white: #ffffff;
            --text-soft: #ffcccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        
        body {
            background: radial-gradient(circle at top, var(--maroon-light), var(--maroon-dark));
            min-height: 100vh;
            padding: 20px;
            color: var(--text-white);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: 900;
        }
        
        .header p {
            font-size: 1.1rem;
            color: var(--text-soft);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 18px;
            border: 2px solid var(--border);
            text-align: center;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: var(--gold);
            font-size: 2.2rem;
            margin: 10px 0;
            font-weight: 800;
        }
        
        .stat-card p {
            color: var(--text-soft);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .users-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .users-section h2 {
            color: var(--gold);
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 800;
        }
        
        .search-box {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--gold);
        }
        
        .search-box button {
            padding: 12px 25px;
            background: var(--gold);
            color: var(--maroon-dark);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 900;
            transition: 0.3s;
        }
        
        .search-box button:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }
        
        .table-wrapper {
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        .users-table thead {
            background: rgba(0,0,0,0.3);
        }
        
        .users-table th {
            padding: 18px;
            text-align: left;
            color: var(--gold);
            font-weight: 800;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        
        .users-table td {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            color: white;
            font-size: 0.95rem;
        }
        
        .users-table tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
        }
        
        .status-active { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid #00ff00; }
        .status-inactive { background: rgba(255, 0, 0, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; }
        
        .mode-indicator {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            border: 1px solid;
        }
        
        .mode-public { border-color: var(--gold); color: var(--gold); }
        .mode-private { border-color: #ffcccc; color: #ffcccc; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gold);
        }
        
        .spinner {
            border: 4px solid rgba(255, 215, 0, 0.1);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid red;
        }
        
        .footer {
            text-align: center;
            color: var(--text-soft);
            margin-top: 40px;
            font-size: 0.9rem;
        }
        
        /* Grid BG */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="container">
        <div class="header">
            <h1>🤖 ADEEL-MINI Admin</h1>
            <p>Bot User Management Console</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <p>Total Users</p>
                <h3 id="totalUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Active Now</p>
                <h3 id="activeUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Private Mode</p>
                <h3 id="privateUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Public Mode</p>
                <h3 id="publicUsers">0</h3>
            </div>
        </div>
        
        <div class="users-section">
            <h2>Live Connections</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by number or name...">
                <button onclick="filterUsers()">🔍 Search</button>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                Fetching Database...
            </div>
            
            <div id="errorDiv"></div>
            
            <div id="tableContainer" class="table-wrapper" style="display:none;">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>📱 Phone Number</th>
                            <th>📊 Status</th>
                            <th>🌐 Mode</th>
                            <th>⏰ Last Active</th>
                            <th>🔗 Sessions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 ADEEL-MINI | Updated: <span id="lastUpdate" style="color:var(--gold)">-</span></p>
        </div>
    </div>
    
    <script>
        let allUsers = [];
        
        async function loadUsers() {
            try {
                // API Call (keeping your original endpoint)
                const response = await fetch('/api/users');
                if (!response.ok) throw new Error('Failed to connect to API');
                
                const data = await response.json();
                allUsers = data.users || [];
                
                updateStats();
                displayUsers(allUsers);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('errorDiv').innerHTML = '';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorDiv').innerHTML = `<div class="error">❌ System Error: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            const total = allUsers.length;
            const active = allUsers.filter(u => u.isActive).length;
            const priv = allUsers.filter(u => u.mode === 'private').length;
            const pub = allUsers.filter(u => u.mode === 'public').length;
            
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('activeUsers').textContent = active;
            document.getElementById('privateUsers').textContent = priv;
            document.getElementById('publicUsers').textContent = pub;
        }
        
        function displayUsers(users) {
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-soft); padding:40px;">No users found in database.</td></tr>';
                return;
            }
            
            users.forEach(user => {
                const row = document.createElement('tr');
                const lastActive = user.lastActive ? new Date(user.lastActive).toLocaleString() : 'Offline';
                
                row.innerHTML = `
                    <td><strong style="color:var(--gold)">${user.number}</strong></td>
                    <td><span class="status-badge ${user.isActive ? 'status-active' : 'status-inactive'}">
                        ${user.isActive ? '● ONLINE' : '○ OFFLINE'}
                    </span></td>
                    <td><span class="mode-indicator ${user.mode === 'private' ? 'mode-private' : 'mode-public'}">
                        ${user.mode === 'private' ? '🔒 PRIVATE' : '🌍 PUBLIC'}
                    </span></td>
                    <td><span style="font-size:0.8rem; opacity:0.8">${lastActive}</span></td>
                    <td><strong style="color:var(--gold)">${user.connectionCount || 0}</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(user => 
                user.number.includes(query) || (user.name && user.name.toLowerCase().includes(query))
            );
            displayUsers(filtered);
        }
        
        setInterval(loadUsers, 30000);
        window.addEventListener('load', loadUsers);
    </script>
</body>
</html>
