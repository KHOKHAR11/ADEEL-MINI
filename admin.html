<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Admin Panel - ADEEL-MINI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #800000; /* Deep Red */
            --bg-secondary: #a00000;
            --bg-card: rgba(102, 0, 0, 0.9);
            --accent-gold: #ffd700; /* Gold */
            --text-primary: #ffffff;
            --text-secondary: #ffcccc;
            --border-color: rgba(255, 215, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Red Grid Effect */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent-gold); }
        
        .stat-card h3 {
            color: var(--accent-gold);
            font-size: 2.2rem;
            margin: 10px 0;
        }
        
        .users-section {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .users-section h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-gold);
            display: inline-block;
            padding-bottom: 5px;
        }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #fff;
            border-radius: 8px;
            color: #white;
            font-size: 1rem;
        }

        .search-box input::placeholder { color: #ffcccc; }
        
        /* White Search Button */
        .btn-search {
            padding: 10px 25px;
            background: #ffffff;
            color: #800000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            position: relative;
        }
        
        .btn-search:hover { background: #f0f0f0; transform: scale(1.05); }

        /* Table Styling */
        .users-table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        
        .users-table th {
            padding: 15px;
            text-align: left;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
        }
        
        .users-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        /* Particles */
        .particle {
            position: absolute; width: 4px; height: 15px;
            background: var(--accent-gold); pointer-events: none;
            border-radius: 2px; z-index: 9999;
        }
        
        .status-badge {
            padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
        }
        .status-active { background: #10b981; color: white; }
        .status-inactive { background: #333; color: #ccc; }
        
        .mode-indicator {
            padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; font-weight: bold;
        }
        .mode-public { background: rgba(255, 215, 0, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .mode-private { background: #fff; color: #800000; }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { text-align: center; color: white; margin-top: 40px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-shield" style="color:var(--accent-gold)"></i> ADEEL-MINI Admin Panel</h1>
            <p>Monitor and manage all connected bot users</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <p>Total Users</p>
                <h3 id="totalUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Active Users</p>
                <h3 id="activeUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Private Mode</p>
                <h3 id="privateUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Public Mode</p>
                <h3 id="publicUsers">0</h3>
            </div>
        </div>
        
        <div class="users-section">
            <h2>Connected Users</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search number or name...">
                <button class="btn-search" onclick="handleSearch(event)">🔍 Search</button>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
            </div>
            
            <div id="tableContainer" style="display:none; overflow-x: auto;">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>📱 Number</th>
                            <th>📊 Status</th>
                            <th>🌐 Mode</th>
                            <th>⏰ Last Active</th>
                            <th>📅 Created</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>© ADEEL-MINI | Updated: <span id="lastUpdate">-</span></p>
        </div>
    </div>
    
    <script>
        // Particle Effect
        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 10;
                const tx = Math.cos(angle) * 160;
                const ty = Math.sin(angle) * 160;

                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.transform = `rotate(${angle}rad)`;

                const anim = p.animate([
                    { transform: `translate(0,0) rotate(${angle}rad)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${angle}rad)`, opacity: 0 }
                ], { duration: 1000, easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)' });

                anim.onfinish = () => p.remove();
            }
        }

        let allUsers = [];
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                allUsers = data.users || [];
                
                updateStats();
                displayUsers(allUsers);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function handleSearch(e) {
            createParticles(e.pageX, e.pageY);
            filterUsers();
        }
        
        function updateStats() {
            document.getElementById('totalUsers').textContent = allUsers.length;
            document.getElementById('activeUsers').textContent = allUsers.filter(u => u.isActive).length;
            document.getElementById('privateUsers').textContent = allUsers.filter(u => u.mode === 'private').length;
            document.getElementById('publicUsers').textContent = allUsers.filter(u => u.mode === 'public').length;
        }
        
        function displayUsers(users) {
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = users.length ? '' : '<tr><td colspan="5" style="text-align:center;">No users found</td></tr>';
            
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${user.number}</strong></td>
                    <td><span class="status-badge ${user.isActive ? 'status-active' : 'status-inactive'}">
                        ${user.isActive ? 'Active' : 'Inactive'}
                    </span></td>
                    <td><span class="mode-indicator ${user.mode === 'private' ? 'mode-private' : 'mode-public'}">
                        ${user.mode === 'private' ? '🔒 Private' : '🌍 Public'}
                    </span></td>
                    <td>${user.lastActive ? new Date(user.lastActive).toLocaleString() : 'Never'}</td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(user => user.number.includes(query));
            displayUsers(filtered);
        }
        
        setInterval(loadUsers, 30000);
        window.addEventListener('load', loadUsers);
    </script>
</body>
</html>
