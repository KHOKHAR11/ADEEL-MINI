<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Admin Panel - ADEEL-MINI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #667eea;
            font-size: 2rem;
            margin: 10px 0;
        }
        
        .stat-card p {
            color: #666;
            font-size: 0.9rem;
        }
        
        .users-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .users-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .search-box button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .search-box button:hover {
            background: #764ba2;
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
        }
        
        .users-table thead {
            background: #f5f5f5;
        }
        
        .users-table th {
            padding: 15px;
            text-align: left;
            color: #667eea;
            font-weight: bold;
            border-bottom: 2px solid #ddd;
        }
        
        .users-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .users-table tr:hover {
            background: #f9f9f9;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        
        .mode-public {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .mode-private {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .mode-indicator {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 ADEEL-MINI Admin Panel</h1>
            <p>Monitor all connected bot users</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <p>Total Users</p>
                <h3 id="totalUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Active Users</p>
                <h3 id="activeUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Private Mode</p>
                <h3 id="privateUsers">0</h3>
            </div>
            <div class="stat-card">
                <p>Public Mode</p>
                <h3 id="publicUsers">0</h3>
            </div>
        </div>
        
        <div class="users-section">
            <h2>Connected Users</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by number or name...">
                <button onclick="filterUsers()">🔍 Search</button>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                Loading user data...
            </div>
            
            <div id="errorDiv"></div>
            
            <div id="tableContainer" style="display:none;">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>📱 Number</th>
                            <th>📊 Status</th>
                            <th>🌐 Mode</th>
                            <th>⏰ Last Active</th>
                            <th>🔗 Connections</th>
                            <th>📅 Created</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>© ADEEL-MINI | Last updated: <span id="lastUpdate">-</span></p>
        </div>
    </div>
    
    <script>
        let allUsers = [];
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) throw new Error('Failed to load users');
                
                const data = await response.json();
                allUsers = data.users || [];
                
                updateStats();
                displayUsers(allUsers);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('errorDiv').innerHTML = '';
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorDiv').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            const total = allUsers.length;
            const active = allUsers.filter(u => u.isActive).length;
            const private_ = allUsers.filter(u => u.mode === 'private').length;
            const public_ = allUsers.filter(u => u.mode === 'public').length;
            
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('activeUsers').textContent = active;
            document.getElementById('privateUsers').textContent = private_;
            document.getElementById('publicUsers').textContent = public_;
        }
        
        function displayUsers(users) {
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#999;">No users found</td></tr>';
                return;
            }
            
            users.forEach(user => {
                const row = document.createElement('tr');
                const lastActive = user.lastActive ? new Date(user.lastActive).toLocaleString() : 'Never';
                const created = user.createdAt ? new Date(user.createdAt).toLocaleString() : 'N/A';
                
                row.innerHTML = `
                    <td><strong>${user.number}</strong></td>
                    <td><span class="status-badge ${user.isActive ? 'status-active' : 'status-inactive'}">
                        ${user.isActive ? '✅ Active' : '❌ Inactive'}
                    </span></td>
                    <td><span class="mode-indicator ${user.mode === 'private' ? 'mode-private' : 'mode-public'}">
                        ${user.mode === 'private' ? '🔒 Private' : '🌍 Public'}
                    </span></td>
                    <td>${lastActive}</td>
                    <td><strong>${user.connectionCount || 0}</strong></td>
                    <td>${created}</td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(user => 
                user.number.includes(query) || (user.name && user.name.toLowerCase().includes(query))
            );
            displayUsers(filtered);
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadUsers, 30000);
        
        // Load on page load
        window.addEventListener('load', loadUsers);
    </script>
</body>
</html>
